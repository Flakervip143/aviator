<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="Card game artwork">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123b2e"/><stop offset="1" stop-color="#071711"/>
    </linearGradient>
    <linearGradient id="kcard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="kglow"><stop stop-color="#16b14a" stop-opacity=".45"/><stop offset="1" stop-color="#16b14a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="460" fill="url(#kbg)"/>
  <circle cx="300" cy="220" r="220" fill="url(#kglow)"/>
  <g transform="translate(300 240)">
    <g transform="rotate(-18) translate(-150 -150)">
      <rect width="150" height="215" rx="14" fill="url(#kcard)" stroke="#0a1829" stroke-opacity=".2"/>
      <text x="18" y="48" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#111827">A</text>
      <text x="24" y="80" font-family="Georgia, serif" font-size="28" fill="#f10033">♥</text>
      <text x="75" y="170" font-family="Georgia, serif" font-size="58" fill="#f10033" text-anchor="middle">♥</text>
    </g>
    <g transform="rotate(4) translate(-40 -120)">
      <rect width="150" height="215" rx="14" fill="url(#kcard)" stroke="#0a1829" stroke-opacity=".2"/>
      <text x="18" y="48" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#111827">K</text>
      <text x="24" y="80" font-family="Georgia, serif" font-size="28" fill="#111827">♠</text>
      <text x="75" y="170" font-family="Georgia, serif" font-size="58" fill="#111827" text-anchor="middle">♠</text>
    </g>
    <g transform="rotate(22) translate(70 -100)">
      <rect width="150" height="215" rx="14" fill="#0f2139" stroke="#facc15" stroke-opacity=".5"/>
      <path d="M75 55 95 95 75 135 55 95Z" fill="none" stroke="#facc15" stroke-width="3"/>
      <text x="75" y="110" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#facc15" text-anchor="middle">7</text>
    </g>
  </g>
  <g fill="#fff7d6" opacity=".7">
    <circle cx="80" cy="390" r="2.5"/><circle cx="520" cy="90" r="2"/><circle cx="540" cy="390" r="2"/>
  </g>
</svg>
